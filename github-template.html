<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>$if(title-prefix)$$title-prefix$ – $endif$$pagetitle$</title>

  $for(css)$
  <link rel="stylesheet" href="$css$">
  $endfor$

  $if(highlighting-css)$
  <style>
  $highlighting-css$
  </style>
  $endif$

  <style>
  body {
    box-sizing: border-box;
    min-width: 200px;
    max-width: 980px;
    margin: 0 auto;
    padding: 45px;
    #background: #0d1117;
    background: #ffffff;
  }

  #.markdown-body {
  #  #background: #0d1117;
  #  background: #ffffff;
  #  #color: #c9d1d9;
  #}

  .highlight {
    position: relative;
    background-color: #f6f8fa;
    border-radius: 6px;
  }

  .markdown-body .highlight pre {
    background-color: transparent;
    border-radius: 0;
  }

  .zeroclipboard-container {
    position: absolute;
    top: 0;
    right: 0;
    z-index: 2;
  }

  .btn {
    position: relative;
    display: inline-block;
    padding: 5px 16px;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    white-space: nowrap;
    vertical-align: middle;
    cursor: pointer;
    user-select: none;
    border: 1px solid rgba(31, 35, 40, 0.15);
    border-radius: 6px;
    appearance: none;
  }

  .btn-invisible {
    color: #59636e;
    background-color: transparent;
    border-color: transparent;
    box-shadow: none;
  }

  .btn-invisible:hover {
    color: #1f2328;
    background-color: #f3f4f6;
    border-color: rgba(31, 35, 40, 0.15);
  }

  .ClipboardButton {
    width: 32px;
    height: 32px;
    padding: 0;
  }

  .position-relative { position: relative !important; }
  .overflow-auto { overflow: auto !important; }
  .m-2 { margin: 8px !important; }
  .p-0 { padding: 0 !important; }
  .d-flex { display: flex !important; }
  .flex-justify-center { justify-content: center !important; }
  .flex-items-center { align-items: center !important; }
  .d-none { display: none !important; }
  .color-fg-success { color: #1a7f37 !important; }

  .ClipboardButton svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .tooltipped {
    position: relative;
  }

  .tooltipped::before,
  .tooltipped::after {
    position: absolute;
    display: none;
    opacity: 0;
    pointer-events: none;
  }

  .tooltipped::before {
    z-index: 1000001;
    width: 0;
    height: 0;
    content: "";
    border: 6px solid transparent;
  }

  .tooltipped::after {
    z-index: 1000000;
    padding: 0.5em 0.75em;
    font: normal normal 11px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    color: #ffffff;
    white-space: pre;
    content: attr(aria-label);
    background: #24292f;
    border-radius: 6px;
    -webkit-font-smoothing: subpixel-antialiased;
  }

  .tooltipped:hover::before,
  .tooltipped:hover::after,
  .tooltipped:active::before,
  .tooltipped:active::after,
  .tooltipped:focus::before,
  .tooltipped:focus::after {
    display: inline-block;
    text-decoration: none;
  }

  .tooltipped:hover::before,
  .tooltipped:hover::after,
  .tooltipped:active::before,
  .tooltipped:active::after,
  .tooltipped:focus::before,
  .tooltipped:focus::after {
    opacity: 1;
  }

  .tooltipped-w::before {
    top: 50%;
    right: 100%;
    margin-top: -6px;
    margin-right: -1px;
    border-left-color: #24292f;
  }

  .tooltipped-w::after {
    top: 50%;
    right: calc(100% + 5px);
    transform: translateY(-50%);
  }

  @media (max-width: 767px) {
    body {
      padding: 15px;
    }
  }
</style>
</head>
<body>
  <article class="markdown-body">
    $body$
  </article>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    function legacyCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.top = '-1000px';
      textarea.style.left = '-1000px';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      let ok = false;
      try {
        ok = document.execCommand('copy');
      } catch (e) {
        ok = false;
      }

      document.body.removeChild(textarea);
      return ok;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          return legacyCopy(text);
        }
      }
      return legacyCopy(text);
    }

    function createClipboardButton() {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'ClipboardButton btn btn-invisible js-clipboard-copy m-2 p-0 d-flex flex-justify-center flex-items-center tooltipped tooltipped-w';
      button.setAttribute('aria-label', 'Copy code to clipboard');
      button.setAttribute('data-copy-feedback', 'Copied!');
      button.setAttribute('data-tooltip-direction', 'w');

      button.innerHTML = `
        <svg aria-hidden="true" data-component="Octicon" height="16" viewBox="0 0 16 16" version="1.1" width="16" class="octicon octicon-copy js-clipboard-copy-icon">
          <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"></path>
          <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"></path>
        </svg>
        <svg aria-hidden="true" data-component="Octicon" height="16" viewBox="0 0 16 16" version="1.1" width="16" class="octicon octicon-check js-clipboard-check-icon color-fg-success d-none">
          <path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"></path>
        </svg>
      `;

      return button;
    }

    function wrapInHighlightContainer(block, pre) {
      let container = block.parentElement;
      if (!(container && container.classList.contains('highlight'))) {
        container = document.createElement('div');
        container.className = 'highlight notranslate position-relative overflow-auto';
        block.parentNode.insertBefore(container, block);
        container.appendChild(block);
      }

      const languageClass = [
        ...pre.classList,
        ...(pre.querySelector('code') ? pre.querySelector('code').classList : [])
      ].find((className) => className !== 'sourceCode' && className !== 'code');

      if (languageClass) {
        container.classList.add('highlight-source-' + languageClass.replace(/^language-/, ''));
      }

      return container;
    }

    const blocks = [];
    const seen = new Set();

    document.querySelectorAll('.markdown-body pre').forEach((pre) => {
      const sourceDiv = pre.closest('div.sourceCode');
      const block = sourceDiv && sourceDiv.querySelector('pre') === pre ? sourceDiv : pre;
      if (seen.has(block)) return;
      seen.add(block);
      blocks.push({ block, pre });
    });

    blocks.forEach(({ block, pre }) => {
      const container = wrapInHighlightContainer(block, pre);
      if (container.querySelector('.zeroclipboard-container')) return;

      const clipboardContainer = document.createElement('div');
      clipboardContainer.className = 'zeroclipboard-container';

      const button = createClipboardButton();
      const copyIcon = button.querySelector('.js-clipboard-copy-icon');
      const checkIcon = button.querySelector('.js-clipboard-check-icon');

      button.addEventListener('click', async function () {
        const codeNode = pre.querySelector('code') || pre;
        const ok = await copyText(codeNode.textContent || '');

        if (!ok) {
          button.setAttribute('aria-label', 'Copy failed');
          setTimeout(() => {
            button.setAttribute('aria-label', 'Copy code to clipboard');
          }, 1200);
          return;
        }

        copyIcon.classList.add('d-none');
        checkIcon.classList.remove('d-none');
        button.setAttribute('aria-label', button.getAttribute('data-copy-feedback') || 'Copied!');

        setTimeout(() => {
          checkIcon.classList.add('d-none');
          copyIcon.classList.remove('d-none');
          button.setAttribute('aria-label', 'Copy code to clipboard');
        }, 1200);
      });

      clipboardContainer.appendChild(button);
      container.appendChild(clipboardContainer);
    });
  });
</script>
</body>
</html>
